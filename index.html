<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Strawberry</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: Arial;
    background: linear-gradient(135deg,#f8f9fa,#e9ecef);
    padding:20px;
}

.header {
    text-align:center;
    margin-bottom:25px;
}

h1 {
    color:#e63946;
}

.gallery {
    display:grid;
    grid-template-columns: repeat(auto-fill,minmax(200px,1fr));
    gap:15px;
}

.card {
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
}

.card img {
    width:100%;
    height:200px;
    object-fit:cover;
}

.modal {
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.9);
    justify-content:center;
    align-items:center;
}

.modal img {
    max-width:90%;
    max-height:90%;
}

.modal.active { display:flex; }

.close {
    position:absolute;
    top:20px;
    right:30px;
    font-size:40px;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
<h1>🍓 Golden Strawberry 🍓</h1>
</div>

<div class="gallery" id="gallery"></div>

<div class="modal" id="modal">
<span class="close" onclick="closeModal()">×</span>
<img id="modalImg">
</div>

<script>
const folderPath = "https://raw.githubusercontent.com/laziz-commits/Golden-strewberry-/main/";

// FAqat oxirgi yuklangan rasmlar (2026-04-30)

];

const gallery = document.getElementById("gallery");
const modal = document.getElementById("modal");
const modalImg = document.getElementById("modalImg");

// Galereya yaratish
imageFiles.forEach(file => {
    const div = document.createElement("div");
    div.className = "card";

    const img = document.createElement("img");
    img.src = folderPath + file;

    img.onerror = () => {
        img.src = "https://via.placeholder.com/300x200?text=No+Image";
    };

    div.onclick = () => {
        modal.classList.add("active");
        modalImg.src = img.src;
    };

    div.appendChild(img);
    gallery.appendChild(div);
});

// Modal yopish
function closeModal(){
    modal.classList.remove("active");
}

// ESC bilan yopish
document.addEventListener("keydown", e=>{
    if(e.key==="Escape") closeModal();
});
</script>

</body>
</html>
